if (/\.github\.io$/.test(location.hostname)) location.replace("https://www.labellotacampers.com/admin/");</script>
<title>Panel — La Bellota Campers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M10 17 Q10 8 24 8 Q38 8 38 17 L38 20 L10 20 Z' fill='%23E8A03C'/%3E%3Cpath d='M12 20 L36 20 Q36 34 24 42 Q12 34 12 20 Z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#121814;--panel:#1A2420;--panel-2:#22302A;--line:#31423A;
  --ink:#EFEBDF;--muted:#9FAEA3;--miel:#F0B04C;--on-miel:#231A08;
  --teja:#E08A5F;--ok:#5FBF7F;--err:#E5715B;
  --font-display:"Bricolage Grotesque",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:.98rem;line-height:1.5}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit}
:focus-visible{outline:2px solid var(--miel);outline-offset:2px;border-radius:4px}

.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
@media (max-width:860px){.layout{grid-template-columns:1fr}}

/* ---- Sidebar ---- */
.side{background:var(--panel);border-right:1px solid var(--line);padding:1.2rem;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:1.2rem}
@media (max-width:860px){.side{position:static;height:auto}}
.side .brand{display:flex;align-items:center;gap:.6rem;font-family:var(--font-display);font-weight:800;font-size:1.15rem;text-decoration:none;color:var(--ink)}
.side .brand svg{width:30px;height:30px}
.side .brand b{color:var(--miel)}
.side .tag{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:.15rem}
.menu button{
  text-align:left;background:none;border:none;color:var(--muted);
  padding:.55rem .7rem;border-radius:9px;font-weight:600;font-size:.92rem;
}
.menu button:hover{background:var(--panel-2);color:var(--ink)}
.menu button.active{background:var(--panel-2);color:var(--miel)}
.side .foot{margin-top:auto;font-size:.78rem;color:var(--muted)}
.side .foot a{color:var(--muted)}

/* ---- Main ---- */
.main{padding:1.4rem clamp(1rem,3vw,2.4rem) 6rem;max-width:980px}
.toolbar{
  position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  padding:.9rem 0;border-bottom:1px solid var(--line);margin-bottom:1.6rem;
}
.toolbar .status{font-size:.85rem;color:var(--muted);margin-right:auto}
.toolbar .status b{color:var(--ink)}
.btn{
  display:inline-flex;align-items:center;gap:.45rem;border:none;border-radius:999px;
  font-weight:700;font-size:.9rem;padding:.6rem 1.15rem;
  background:var(--panel-2);color:var(--ink);border:1px solid var(--line);
  transition:transform .12s, background .12s;
}
.btn:hover{transform:translateY(-1px);background:#2A3B33}
.btn--miel{background:var(--miel);color:var(--on-miel);border-color:transparent}
.btn--miel:hover{background:#F7BE63}
.btn--ghost{background:transparent}
.btn:disabled{opacity:.55;cursor:wait;transform:none}

h1{font-family:var(--font-display);font-weight:800;font-size:1.6rem;letter-spacing:-.01em;margin-bottom:.3rem}
.sub{color:var(--muted);font-size:.92rem;margin-bottom:1.4rem;max-width:44rem}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.15rem;margin-bottom:1rem}
.card h3{font-family:var(--font-display);font-size:1.05rem;margin-bottom:.9rem;color:var(--miel)}
.field{display:grid;gap:.3rem;margin-bottom:.9rem}
.field:last-child{margin-bottom:0}
.field>span{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field small{color:var(--muted);font-size:.78rem}
input[type=text],input[type=number],input[type=password],input[type=url],textarea,select{
  background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--ink);
  padding:.62rem .75rem;width:100%;
}
input:focus,textarea:focus,select:focus{outline:2px solid var(--miel);border-color:var(--miel)}
textarea{min-height:86px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}

/* Image field */
.imgfield{display:grid;grid-template-columns:110px 1fr;gap:.8rem;align-items:start}
.imgfield .thumb{
  width:110px;height:78px;border-radius:9px;object-fit:cover;background:var(--panel-2);
  border:1px solid var(--line);display:block;
}
.imgfield .acts{display:flex;gap:.5rem;margin-top:.45rem;flex-wrap:wrap}
.imgfield .acts .btn{padding:.4rem .8rem;font-size:.8rem}

/* Lists */
.item{
  border:1px solid var(--line);border-radius:11px;padding: .9rem;margin-bottom:.7rem;background:var(--panel-2);
}
.item__bar{display:flex;justify-content:flex-end;gap:.35rem;margin-bottom:.6rem}
.item__bar .btn{padding:.28rem .6rem;font-size:.78rem;border-radius:8px}
.addbtn{width:100%;border-style:dashed;justify-content:center}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%) translateY(20px);
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  border-radius:999px;padding:.7rem 1.3rem;font-weight:600;font-size:.9rem;
  opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 12px 34px rgba(0,0,0,.5);
  max-width:min(92vw,34rem);text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.ok{border-color:var(--ok)}
.toast.err{border-color:var(--err)}

.pill{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:700;border-radius:999px;padding:.25rem .7rem;background:var(--panel-2);border:1px solid var(--line)}

/* Calendario admin */
.admcal__tools{display:flex;gap:.7rem;align-items:end;flex-wrap:wrap;margin-bottom:1rem}
.admcal__nav{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.8rem}
.admcal__nav span{font-size:.8rem;color:var(--muted);text-align:center}
.admcal{display:grid;grid-template-columns:1fr 1fr;gap:1.3rem}
@media(max-width:760px){.admcal{grid-template-columns:1fr}}
.admcal h4{font-family:var(--font-display);text-transform:capitalize;text-align:center;margin-bottom:.55rem}
.admcal__grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.admcal__dow{font-size:.68rem;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;padding-bottom:.25rem}
.admcal__dia{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:7px;font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums;border:1px solid transparent}
.admcal__dia.vacio{visibility:hidden}
.admcal__dia.libre{background:#1E3226;border-color:#2E5940;cursor:pointer;transition:border-color .1s}
.admcal__dia.libre:hover{border-color:var(--miel)}
.admcal__dia.ocupado{background:#46281A;border-color:#8A4E2A;color:#EBAD8C;text-decoration:line-through;cursor:pointer}
.admcal__dia.ocupado:hover{border-color:var(--miel)}
.admcal__dia.pasado{opacity:.28}
.admcal__dia.hoy{box-shadow:inset 0 0 0 2px var(--miel)}
.admcal__foot{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;flex-wrap:wrap;gap:.6rem}
.pill.ok{color:var(--ok)}
.pill.err{color:var(--err)}
.warn{background:#3A2A18;border:1px solid #6E4E22;border-radius:11px;padding: .8rem .95rem;font-size:.85rem;color:#F4D9A8;margin-bottom:1rem}
code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.1rem .4rem;font-size:.85em}
/* --- Estadísticas --- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin-bottom:1.3rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:.9rem 1rem}
.kpi b{display:block;font-family:var(--font-display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
.stats table{width:100%;border-collapse:collapse;font-size:.88rem}
.stats td{padding:.4rem .5rem;border-bottom:1px solid var(--line);position:relative}
.stats td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;width:4.5rem}
.stats tr:last-child td{border-bottom:none}
.statbar{position:absolute;left:0;top:15%;bottom:15%;background:color-mix(in srgb,var(--miel) 22%,transparent);border-radius:5px;pointer-events:none}
.statlbl{position:relative;overflow-wrap:anywhere}
.dchart{display:flex;align-items:flex-end;gap:2px;height:120px}
.dbar{flex:1;min-width:2px;background:var(--miel);opacity:.85;border-radius:3px 3px 0 0}
.dbar:hover{opacity:1}
</style>
</head>

  <aside class="side">

<script src="../content/content.js"></script>
<script>
"use strict";
/* =====================================================================
   PANEL DE ADMINISTRACIÓN — La Bellota Campers
   - Edita una copia (borrador) de window.SITE_CONTENT en localStorage.
   - "Vista previa" abre la web usando el borrador (index.html?preview=1).
   - "Publicar" sube content/content.js al repo de GitHub vía API REST
     (token fine-grained del propietario; solo permiso Contents RW).
   ===================================================================== */

const LS_DRAFT = "labellota_draft";
const LS_GH    = "labellota_gh";
const LS_BASE  = "labellota_base"; // instantánea de la web sobre la que nació el borrador
const PUBLISHED = JSON.parse(JSON.stringify(window.SITE_CONTENT || {}));

let DRAFT = loadDraft();
let dirty = false;

function loadDraft(){
  try{
    const d = localStorage.getItem(LS_DRAFT);
    if (d){
      // Borrador previo sin base registrada (versión antigua del panel): ancla la base ahora.
      if (!localStorage.getItem(LS_BASE)) localStorage.setItem(LS_BASE, JSON.stringify(PUBLISHED));
      return JSON.parse(d);
    }
  }catch(e){}
  localStorage.setItem(LS_BASE, JSON.stringify(PUBLISHED));
  return JSON.parse(JSON.stringify(PUBLISHED));
}
function saveDraft(){
  localStorage.setItem(LS_DRAFT, JSON.stringify(DRAFT));
  dirty = true; paintStatus();
}
let saveTimer;
const queueSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveDraft, 300); };

const getP = (o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
const setP = (o,p,v)=>{const ks=p.split(".");const last=ks.pop();let t=o;for(const k of ks){if(t[k]==null)t[k]=isNaN(+ks[ks.indexOf(k)+1] ?? last)?{}:[];t=t[k];}t[last]=v;};
const esc = s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ---------------- Esquema del editor ---------------- */
const ICONOS = ["km","seguro","carnet","mascota","limpio","plazas","cama","medidas","motor","agua","solar"];
const SECTIONS = [
  { id:"negocio", nombre:"🏠 Datos del negocio", desc:"Nombre, contacto y datos que aparecen por toda la web.", cards:[
    { t:"Identidad", f:[
      ["negocio.nombre","Nombre del negocio"],
      ["negocio.claim","Frase corta (claim)"],
      ["negocio.base","Base / ubicación"],
      ["negocio.horario","Horario de atención"] ]},
    { t:"Contacto", f:[
      ["negocio.telefono","Teléfono visible"],
      ["negocio.whatsapp","WhatsApp (solo números con prefijo, ej. 34612345678)"],
      ["negocio.email","Email"],
      ["negocio.instagram","Usuario de Instagram (sin @)"] ]}
  ]},
  { id:"hero", nombre:"🌅 Portada", desc:"Lo primero que ve el cliente: gran foto, titular y botones.", cards:[
    { t:"Textos", f:[
      ["hero.badge","Etiqueta pequeña (badge)"],
      ["hero.eyebrow","Antetítulo"],
      ["hero.titulo","Titular (usa saltos de línea)","ta"],
      ["hero.subtitulo","Subtítulo","ta"],
      ["hero.cta1","Botón principal"],
      ["hero.cta2","Botón secundario"] ]},
    { t:"Imagen de portada", f:[ ["hero.foto","Foto principal","img"] ]}
  ]},
  { id:"claves", nombre:"⭐ Ventajas (barra verde)", desc:"Los 5 puntos fuertes bajo la portada.", list:{ path:"claves", labelItem:"Ventaja", campos:[
      ["icono","Icono","icon"],["titulo","Título"],["texto","Texto corto"] ]}},
  { id:"intro", nombre:"🏝 Bloque isla", desc:"El texto emocional con foto que presenta la experiencia.", cards:[
    { t:"Textos", f:[
      ["intro.eyebrow","Antetítulo"],
      ["intro.titulo","Título"],
      ["intro.texto1","Párrafo 1","ta"],
      ["intro.texto2","Párrafo 2","ta"],
      ["intro.fotoPie","Frase manuscrita sobre la foto"] ]},
    { t:"Imagen", f:[ ["intro.foto","Foto del bloque","img"] ]}
  ]},
  { id:"camper", nombre:"🚐 La camper", desc:"La ficha de la furgoneta: fotos, descripción y características.", cards:[
    { t:"Ficha", f:[
      ["camper.eyebrow","Antetítulo"],
      ["camper.nombre","Nombre de la camper"],
      ["camper.tipo","Tipo / subtítulo"],
      ["camper.descripcion","Descripción","ta"] ]}
  ], lists:[
    { path:"camper.fotos", titulo:"Galería de fotos", labelItem:"Foto", campos:[ ["url","Imagen","img"],["alt","Descripción corta (alt)"] ]},
    { path:"camper.specs", titulo:"Características (6 recomendadas)", labelItem:"Característica", campos:[ ["icono","Icono","icon"],["valor","Dato principal"],["detalle","Detalle"] ]},
    { path:"camper.equipamiento", titulo:"Equipamiento incluido", labelItem:"Elemento", simple:true }
  ]},
  { id:"tarifas", nombre:"💶 Tarifas", desc:"Temporadas, precios y condiciones del alquiler.", cards:[
    { t:"Encabezado", f:[ ["tarifas.titulo","Título"], ["tarifas.nota","Nota bajo los precios","ta"] ]}
  ], lists:[
    { path:"tarifas.temporadas", titulo:"Temporadas", labelItem:"Temporada", campos:[ ["nombre","Nombre"],["meses","Meses"],["precio","Precio (número = €/noche, o texto libre: «desde 110 €», «−10 %»)"] ]},
    { path:"tarifas.condiciones", titulo:"Condiciones", labelItem:"Condición", campos:[ ["label","Concepto"],["valor","Valor"] ]}
  ]},
  { id:"disponibilidad", nombre:"📅 Disponibilidad", desc:"Marca los días OCUPADOS haciendo clic en el calendario (o por rango). Lo que publiques es lo que verá el cliente.", cards:[
    { t:"Textos de la sección", f:[
      ["disponibilidad.titulo","Título"],
      ["disponibilidad.texto","Texto","ta"],
      ["disponibilidad.nota","Nota bajo el calendario"] ]}
  ]},
  { id:"pasos", nombre:"👣 Cómo funciona", desc:"Los 4 pasos de la reserva.", list:{ path:"pasos", labelItem:"Paso", campos:[ ["titulo","Título"],["texto","Texto","ta"] ]}},
  { id:"noche", nombre:"🌌 Bloque nocturno", desc:"La sección emocional con la foto de estrellas.", cards:[
    { t:"Textos", f:[
      ["noche.eyebrow","Antetítulo"],
      ["noche.titulo","Título"],
      ["noche.texto","Texto","ta"],
      ["noche.cita","Cita manuscrita"] ]},
    { t:"Imagen", f:[ ["noche.foto","Foto de fondo","img"] ]}
  ]},
  { id:"areas", nombre:"⛺ Áreas de pernocta", desc:"La selección de zonas para acampar o pernoctar (se muestra tras las rutas). En «Tipo» escribe: cabildo (icono tienda, verde), camping (árbol, miel) o area (furgoneta, teja).", cards:[
    { t:"Encabezado", f:[
      ["areas.eyebrow","Antetítulo"],
      ["areas.titulo","Título"],
      ["areas.texto","Texto","ta"],
      ["areas.permisoLabel","Texto del botón de permisos"],
      ["areas.permisoUrl","URL de permisos del Cabildo"],
      ["areas.aviso","Aviso al pie de la sección","ta"] ]}
  ], lists:[
    { path:"areas.lista", titulo:"Áreas", labelItem:"Área", campos:[
      ["nombre","Nombre"],["zona","Municipio / zona"],["tipo","Tipo (cabildo, camping o area)"],["servicios","Servicios (separados por ·)"],["nota","Nota corta","ta"] ]}
  ]},
  { id:"resenas", nombre:"💬 Reseñas", desc:"Las opiniones que se publican en la web. Los clientes las envían por WhatsApp desde el formulario de la web: pégalas en la bandeja y revisa antes de publicar. Borra con 🗑 las que no convengan.", cards:[
    { t:"Encabezado", f:[ ["resenas.titulo","Título"],["resenas.aviso","Aviso (déjalo vacío cuando sean reales)"],["resenas.formTitulo","Título del formulario 'deja tu opinión'"],["resenas.formTexto","Texto del formulario","ta"] ]}
  ], lists:[
    { path:"resenas.lista", titulo:"Reseñas publicadas", labelItem:"Reseña", campos:[ ["nombre","Nombre"],["viaje","Detalle del viaje"],["estrellas","Estrellas (1–5)","num"],["texto","Texto","ta"] ]}
  ]},
  { id:"hermano", nombre:"🥓 La Bellota Extremeña", desc:"La banda de la casa madre en la web. Si vacías el título, la sección desaparece de la web.", cards:[
    { t:"Textos", f:[
      ["hermano.eyebrow","Antetítulo"],
      ["hermano.titulo","Nombre del negocio"],
      ["hermano.texto","Texto","ta"],
      ["hermano.direccion","Dirección"],
      ["hermano.telefono","Teléfono"] ]}
  ], lists:[
    { path:"hermano.enlaces", titulo:"Enlaces (botones)", labelItem:"Enlace", campos:[ ["label","Texto del botón"],["url","URL"] ]}
  ]},
  { id:"faq", nombre:"❓ Preguntas frecuentes", desc:"Las dudas típicas con su respuesta.", list:{ path:"faq", labelItem:"Pregunta", campos:[ ["p","Pregunta"],["r","Respuesta","ta"] ]}},
  { id:"contacto", nombre:"✉️ Contacto y pie", desc:"Encabezados del bloque de contacto y texto del pie.", cards:[
    { t:"Contacto", f:[ ["contacto.titulo","Título"],["contacto.texto","Texto","ta"],["contacto.formNota","Nota bajo el formulario"] ]},
    { t:"Pie de página", f:[ ["footer.texto","Texto del pie","ta"] ]}
  ]}
];

/* ---------------- Render ---------------- */
const $ = id=>document.getElementById(id);
let currentSec = "negocio";

function fieldHtml(path,label,tipo){
  const val = getP(DRAFT,path);
  if (tipo==="ta") return `<label class="field"><span>${esc(label)}</span><textarea data-path="${path}">${esc(val)}</textarea></label>`;
  if (tipo==="num") return `<label class="field"><span>${esc(label)}</span><input type="number" data-path="${path}" value="${esc(val)}"></label>`;
  if (tipo==="icon"){
    const opts = ICONOS.map(i=>`<option value="${i}"${i===val?" selected":""}>${i}</option>`).join("");
    return `<label class="field"><span>${esc(label)}</span><select data-path="${path}">${opts}</select></label>`;
  }
  if (tipo==="img"){
    const src = resolveImg(val);
    return `<div class="field"><span>${esc(label)}</span>
      <div class="imgfield">
        <img class="thumb" src="${esc(src)}" onerror="this.style.opacity=.25" alt="">
        <div>
          <input type="text" data-path="${path}" value="${esc(val)}" placeholder="https://… o content/img/archivo.jpg">
          <div class="acts">
            <button class="btn" type="button" data-upload="${path}">⬆ Subir imagen al repo</button>
          </div>
          <small>Pega una URL o sube un archivo (requiere GitHub configurado). Recomendado: JPG ≤ 1600 px.</small>
        </div>
      </div></div>`;
  }
  return `<label class="field"><span>${esc(label)}</span><input type="text" data-path="${path}" value="${esc(val)}"></label>`;
}
function resolveImg(u){
  if (!u) return "";
  return /^https?:/i.test(u) ? u : "../"+u;
}
function listHtml(cfg){
  const arr = getP(DRAFT,cfg.path) || [];
  const items = arr.map((item,i)=>{
    const inner = cfg.simple
      ? fieldHtml(`${cfg.path}.${i}`, cfg.labelItem+" "+(i+1))
      : cfg.campos.map(([k,l,t])=>fieldHtml(`${cfg.path}.${i}.${k}`,l,t)).join("");
    return `<div class="item">
      <div class="item__bar">
        <button class="btn" data-move="${cfg.path}|${i}|-1" title="Subir">↑</button>
        <button class="btn" data-move="${cfg.path}|${i}|1" title="Bajar">↓</button>
        <button class="btn" data-del="${cfg.path}|${i}" title="Eliminar">🗑</button>
      </div>${inner}</div>`;
  }).join("");
  return `<div class="card"><h3>${esc(cfg.titulo||cfg.labelItem+"s")}</h3>${items}
    <button class="btn addbtn" data-add="${cfg.path}" data-simple="${cfg.simple?1:0}">＋ Añadir ${esc(cfg.labelItem.toLowerCase())}</button></div>`;
}

function renderSection(){
  const sec = SECTIONS.find(s=>s.id===currentSec);
  let html = "";
  if (sec){
    html = `<h1>${sec.nombre}</h1><p class="sub">${esc(sec.desc)}</p>`;
    (sec.cards||[]).forEach(c=>{ html += `<div class="card"><h3>${esc(c.t)}</h3>`+c.f.map(([p,l,t])=>fieldHtml(p,l,t)).join("")+`</div>`; });
    if (sec.id==="disponibilidad") html += admCalHtml();
    if (sec.id==="resenas") html += bandejaHtml();
    if (sec.list) html += listHtml({...sec.list, titulo:null});
    (sec.lists||[]).forEach(l=>{ html += listHtml(l); });
  } else if (currentSec==="_github"){
    html = githubHtml();
  } else if (currentSec==="_datos"){
    html = datosHtml();
  } else if (currentSec==="_stats"){
    html = statsHtml();
  }
  $("content").innerHTML = html;
  bindInputs();
}

function bindInputs(){
  document.querySelectorAll("[data-path]").forEach(el=>{
    el.addEventListener("input",()=>{
      let v = el.value;
      if (el.type==="number") v = v==="" ? "" : +v;
      setP(DRAFT, el.getAttribute("data-path"), v);
      queueSave();
      if (el.closest(".imgfield")){
        const img = el.closest(".imgfield").querySelector(".thumb");
        img.style.opacity=1; img.src = resolveImg(v);
      }
    });
  });
  document.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>{
    const path=b.getAttribute("data-add");
    const arr=getP(DRAFT,path)||[];
    const sec=SECTIONS.find(s=>s.id===currentSec);
    const cfg=(sec.list && sec.list.path===path) ? sec.list : (sec.lists||[]).find(l=>l.path===path);
    arr.push(cfg.simple ? "" : Object.fromEntries(cfg.campos.map(([k])=>[k,""])));
    setP(DRAFT,path,arr); saveDraft(); renderSection();
  }));
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    const [path,i]=b.getAttribute("data-del").split("|");
    const arr=getP(DRAFT,path); arr.splice(+i,1);
    saveDraft(); renderSection();
  }));
  document.querySelectorAll("[data-move]").forEach(b=>b.addEventListener("click",()=>{
    const [path,i,d]=b.getAttribute("data-move").split("|");
    const arr=getP(DRAFT,path); const from=+i, to=from+ +d;
    if (to<0||to>=arr.length) return;
    [arr[from],arr[to]]=[arr[to],arr[from]];
    saveDraft(); renderSection();
  }));
  document.querySelectorAll("[data-upload]").forEach(b=>b.addEventListener("click",()=>uploadImage(b.getAttribute("data-upload"))));
  if (currentSec==="_github") bindGithub();
  if (currentSec==="_datos") bindDatos();
  if (currentSec==="_stats") bindStats();
  if (currentSec==="disponibilidad") bindAdmCal();
  if (currentSec==="resenas") bindBandeja();
}

/* ---------------- Calendario de disponibilidad (admin) ---------------- */
let admOffset = 0;
const isoDia = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function ocupadoArr(){
  if (!DRAFT.disponibilidad) DRAFT.disponibilidad = { titulo:"¿Cuándo te vienes?", texto:"", nota:"", ocupado:[] };
  if (!Array.isArray(DRAFT.disponibilidad.ocupado)) DRAFT.disponibilidad.ocupado = [];
  return DRAFT.disponibilidad.ocupado;
}
function admCalHtml(){
  return `<div class="card"><h3>🗓 Días ocupados — clic en un día para alternar</h3>
    <div class="admcal__tools">
      <label class="field" style="margin:0;flex:1;min-width:9rem"><span>Desde</span><input type="date" id="rangoA"></label>
      <label class="field" style="margin:0;flex:1;min-width:9rem"><span>Hasta</span><input type="date" id="rangoB"></label>
      <button class="btn" type="button" id="rangoOcupar">Marcar ocupado</button>
      <button class="btn" type="button" id="rangoLiberar">Marcar libre</button>
    </div>
    <div class="admcal__nav">
      <button class="btn" type="button" id="admPrev">‹ Anterior</button>
      <span>Los clientes ven este mismo calendario en la web</span>
      <button class="btn" type="button" id="admNext">Siguiente ›</button>
    </div>
    <div class="admcal" id="admCal"></div>
    <div class="admcal__foot">
      <span class="pill" id="admCount"></span>
      <button class="btn btn--ghost" type="button" id="admLimpiaPasado">🧹 Quitar días ya pasados</button>
    </div>
  </div>`;
}
function renderAdmCal(){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const hoyIso = isoDia(hoy);
  const occ = new Set(ocupadoArr());
  const DOW = ["L","M","X","J","V","S","D"];
  let html = "";
  for (let k=0;k<2;k++){
    const base = new Date(hoy.getFullYear(), hoy.getMonth()+admOffset+k, 1);
    const y=base.getFullYear(), m=base.getMonth();
    const pad=(base.getDay()+6)%7, dias=new Date(y,m+1,0).getDate();
    let cells = DOW.map(d=>`<span class="admcal__dow">${d}</span>`).join("");
    for(let i=0;i<pad;i++) cells+=`<span class="admcal__dia vacio"></span>`;
    for(let d=1;d<=dias;d++){
      const f=isoDia(new Date(y,m,d));
      const cls="admcal__dia"+(f<hoyIso?" pasado":(occ.has(f)?" ocupado":" libre"))+(f===hoyIso?" hoy":"");
      cells+=`<span class="${cls}" data-f="${f}">${d}</span>`;
    }
    html+=`<div><h4>${base.toLocaleDateString("es-ES",{month:"long",year:"numeric"})}</h4><div class="admcal__grid">${cells}</div></div>`;
  }
  $("admCal").innerHTML=html;
  $("admCount").textContent = ocupadoArr().length+" días marcados como ocupados";
  $("admCal").querySelectorAll(".admcal__dia.libre, .admcal__dia.ocupado").forEach(el=>el.addEventListener("click",()=>{
    const f=el.getAttribute("data-f"); const arr=ocupadoArr(); const i=arr.indexOf(f);
    if(i>=0){arr.splice(i,1);} else {arr.push(f);}
    arr.sort(); queueSave(); renderAdmCal();
  }));
}
function bindAdmCal(){
  renderAdmCal();
  $("admPrev").addEventListener("click",()=>{admOffset=Math.max(0,admOffset-1);renderAdmCal();});
  $("admNext").addEventListener("click",()=>{admOffset=Math.min(17,admOffset+1);renderAdmCal();});
  const rango=(marcar)=>{
    const a=$("rangoA").value,b=$("rangoB").value;
    if(!a||!b||b<a){toast("Elige un rango válido (desde / hasta)","err");return;}
    const arr=ocupadoArr(); const d=new Date(a+"T12:00");
    while(isoDia(d)<=b){
      const f=isoDia(d); const i=arr.indexOf(f);
      if(marcar&&i<0)arr.push(f);
      if(!marcar&&i>=0)arr.splice(i,1);
      d.setDate(d.getDate()+1);
    }
    arr.sort(); saveDraft(); renderAdmCal();
    toast(marcar?"Rango marcado como ocupado":"Rango liberado","ok");
  };
  $("rangoOcupar").addEventListener("click",()=>rango(true));
  $("rangoLiberar").addEventListener("click",()=>rango(false));
  $("admLimpiaPasado").addEventListener("click",()=>{
    const hoyIso=isoDia(new Date());
    DRAFT.disponibilidad.ocupado=ocupadoArr().filter(f=>f>=hoyIso);
    saveDraft(); renderAdmCal(); toast("Días pasados eliminados de la lista","ok");
  });
}

let statsDias = 30;
const EV_NOMBRES = {
  whatsapp:"Clic en WhatsApp", telefono:"Clic en teléfono", email:"Clic en email",
  form_fechas:"Consulta rápida de fechas", form_reserva:"Formulario de reserva", form_opinion:"Opinión enviada",
  calendario:"Calendario (días tocados)", galeria:"Galería de fotos", explora:"Ir a Explora GC",
  nav:"Navegación entre secciones", legal:"Páginas legales", externo:"Enlaces externos",
  instagram:"Instagram", scroll:"Lectura de la página (scroll)", campana:"Llegadas de campaña (utm)",
  opinion_estrellas:"Estrellas de opinión"
};
function statsHtml(){
  return `<h1>📊 Estadísticas</h1>
  <p class="sub">Medición propia, anónima y sin cookies. Las visitas desde navegadores con este panel configurado no cuentan. Las cifras de Vercel Analytics (países, orígenes…) se ven en vercel.com → proyecto → Analytics.</p>

    ${[7,30,90].map(d=>`<button class="btn${d===statsDias?" btn--miel":""}" data-statdias="${d}">Últimos ${d} días</button>`).join("")}
    <span class="pill" id="statsEstado">Cargando…</span>
  </div>
  <div id="statsOut"></div>`;
}
function statsUrl(){
  const base = location.pathname.replace(/\/(index\.html)?$/,"");
  return base + "/api/stats?dias=" + statsDias;
}
function statsFila(nombre, n, max){
  const pct = max ? Math.round(n/max*100) : 0;
  return `<tr><td><span class="statbar" style="width:${pct}%"></span><span class="statlbl">${esc(nombre)}</span></td><td>${n}</td></tr>`;
}
function statsTabla(titulo, pares){
  if (!pares.length) return "";
  const max = pares[0][1];
  return `<div class="card stats"><h3>${titulo}</h3><table><tbody>` +
    pares.map(([k,v])=>statsFila(k,v,max)).join("") + `</tbody></table></div>`;
}
async function cargarStats(){
  const pill=$("statsEstado"), out=$("statsOut");
  try{
    const r = await fetch(statsUrl(), {cache:"no-store"});
    if (r.status===401) throw new Error("Sin autorización (recarga y vuelve a identificarte)");
    if (!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    if (!j.configurado){
      pill.textContent="Almacén sin configurar"; pill.className="pill err";
      out.innerHTML = `<div class="warn">📦 Falta el almacén de datos (gratuito). En <b>vercel.com → proyecto la-bellota → Storage → Create database → Upstash (Redis)</b>, plan gratuito, y conectarlo al proyecto (crea solo las variables <code>KV_REST_API_URL</code> y <code>KV_REST_API_TOKEN</code>). Tras el siguiente deploy, esta página empezará a registrar visitas y clics.</div>`;
      return;
    }
    if (j.error) throw new Error(j.error);
    render(j.dias);
    pill.textContent="✓ Al día"; pill.className="pill ok";
  }catch(e){
    pill.textContent="✗ "+e.message; pill.className="pill err";
    out.innerHTML = `<div class="warn">No se pudieron cargar las estadísticas. Solo funcionan en la web publicada (no en local). Detalle: ${esc(e.message)}</div>`;
  }

  function render(dias){
    // Agregados sobre el rango
    const tot = {pv:0, unicos:0, pag:{}, ref:{}, geo:{}, dev:{}, ev:{}, el:{}};
    dias.forEach(d=>{
      tot.unicos += d.unicos;
      Object.entries(d.f).forEach(([k,v])=>{
        const [tipo,...resto]=k.split("|"); const clave=resto.join("|");
        if (tipo==="pv"){ tot.pv+=v; tot.pag[clave]=(tot.pag[clave]||0)+v; }
        else if (tipo==="ref") tot.ref[clave]=(tot.ref[clave]||0)+v;
        else if (tipo==="geo") tot.geo[clave]=(tot.geo[clave]||0)+v;
        else if (tipo==="dev") tot.dev[clave]=(tot.dev[clave]||0)+v;
        else if (tipo==="ev") tot.ev[clave]=(tot.ev[clave]||0)+v;
        else if (tipo==="el") tot.el[clave]=(tot.el[clave]||0)+v;
      });
    });
    const orden = o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
    const kpi = (n,l)=>`<div class="kpi"><b>${n}</b><span>${l}</span></div>`;

    // Gráfico diario (de más antiguo a hoy)
    const serie=[...dias].reverse();
    const maxPv=Math.max(1,...serie.map(d=>{
      let s=0; Object.entries(d.f).forEach(([k,v])=>{ if(k.startsWith("pv|")) s+=v; }); d._pv=s; return s;
    }));
    const barras=serie.map(d=>`<div class="dbar" style="height:${Math.max(2,Math.round(d._pv/maxPv*100))}%" title="${d.fecha}: ${d._pv} visitas, ${d.unicos} únicos"></div>`).join("");

    const evPares = orden(tot.ev).map(([k,v])=>[EV_NOMBRES[k]||k, v]);
    const detalle = orden(tot.el).map(([k,v])=>{
      const [n,...l]=k.split("|");
      return `<tr><td><span class="statlbl">${esc((EV_NOMBRES[n]||n)+" · "+l.join("|"))}</span></td><td>${v}</td></tr>`;
    }).join("");

    out.innerHTML = `
      <div class="kpis">
        ${kpi(tot.pv,"páginas vistas")}
        ${kpi(tot.unicos,"visitantes únicos (suma diaria)")}
        ${kpi(tot.ev.whatsapp||0,"clics en WhatsApp")}
        ${kpi((tot.ev.form_fechas||0)+(tot.ev.form_reserva||0),"consultas de reserva")}
      </div>
      <div class="card stats"><h3>Visitas por día</h3><div class="dchart">${barras}</div></div>
      ${statsTabla("Qué páginas miran", orden(tot.pag))}
      ${statsTabla("Qué hacen (interacciones)", evPares)}
      ${detalle ? `<div class="card stats"><details><summary style="cursor:pointer;font-weight:700">Detalle de interacciones (dónde exactamente)</summary><table><tbody>${detalle}</tbody></table></details></div>` : ""}
      ${statsTabla("De dónde llegan (referencias externas)", orden(tot.ref))}
      ${statsTabla("Países", orden(tot.geo))}
      ${statsTabla("Dispositivo", orden(tot.dev))}
      <p class="sub" style="margin-top:.8rem">Los «visitantes únicos» son únicos <b>por día</b> (estimación anónima); si alguien vuelve otro día cuenta de nuevo.</p>`;
  }
}
function bindStats(){
  document.querySelectorAll("[data-statdias]").forEach(b=>b.addEventListener("click",()=>{
    statsDias=+b.getAttribute("data-statdias"); renderSection();
  }));
  cargarStats();
}

const b64encode = (str)=>{
  const bytes = new TextEncoder().encode(str);
  let bin=""; const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) bin += String.fromCharCode(...bytes.subarray(i,i+CH));
  return btoa(bin);
};

/* Guardián de versión: ¿ha cambiado la web publicada desde que nació este borrador?
   Evita pisar sin querer cambios hechos por otra vía (otro navegador, la consola…).
   Ante cualquier duda o error devuelve false para no bloquear la publicación. */
async function remoteChangedSinceBase(){
  try{
    const base = localStorage.getItem(LS_BASE);
    if (!base) return false;
    const g = ghConfig();
    if (!g.token) return false;
    const api = `https://api.github.com/repos/${g.owner}/${g.repo}/contents/content/content.js?ref=${g.branch}`;
    const r = await fetch(api,{headers:ghHeaders(g.token)});
    if (!r.ok) return false;
    const j = await r.json();
    const bin = atob((j.content||"").replace(/\n/g,""));
    const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
    const text = new TextDecoder().decode(bytes);
    const m = text.match(/window\.SITE_CONTENT\s*=\s*([\s\S]*?);\s*$/);
    if (!m) return false;
    return JSON.stringify(JSON.parse(m[1])) !== JSON.stringify(JSON.parse(base));
  }catch(e){ return false; }
}

async function ghPut(path, base64, message){
  const g = ghConfig();
  if (!g.token) throw new Error("Configura GitHub primero (menú ⚙️ Publicación).");
  const api = `https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}`;
  let sha;
  const head = await fetch(api+`?ref=${g.branch}`,{headers:ghHeaders(g.token)});
  if (head.ok) sha = (await head.json()).sha;
  const r = await fetch(api,{
    method:"PUT", headers:ghHeaders(g.token),
    body: JSON.stringify({ message, branch:g.branch, content:base64, ...(sha?{sha}:{}) })
  });
  if (!r.ok){
    const j = await r.json().catch(()=>({}));
    throw new Error(j.message || "HTTP "+r.status);
  }
  return r.json();
}

$("btnPublish").addEventListener("click", async ()=>{
  const b=$("btnPublish");
  if (!ghConfig().token){ currentSec="_github"; renderSection(); toast("Configura GitHub para poder publicar","err"); return; }
  b.disabled=true; b.textContent="Comprobando…";
  const cambiado = await remoteChangedSinceBase();
  b.disabled=false; b.textContent="🚀 Publicar";
  if (cambiado && !confirm(
    "⚠️ ATENCIÓN: la web publicada ha CAMBIADO desde que empezaste este borrador\n" +
    "(otra publicación del panel o un cambio desde la consola).\n\n" +
    "Si publicas ahora, tu borrador SUSTITUIRÁ esos cambios y podrían perderse.\n\n" +
    "Recomendado: Cancelar → «Descartar borrador» → rehacer tus cambios sobre lo último.\n\n" +
    "¿Publicar de todos modos?")) return;
  if (!cambiado && !confirm("¿Publicar los cambios en la web?")) return;
  b.disabled=true; b.textContent="Publicando…";
  try{
    await ghPut("content/content.js", b64encode(contentFileBody()), "content: actualización desde el panel");
    localStorage.removeItem(LS_DRAFT);
    localStorage.setItem(LS_BASE, JSON.stringify(DRAFT));
    dirty=false; paintStatus();
    toast("✅ Publicado. La web pública se actualiza en 1–2 min.","ok");
  }catch(e){ toast("Error al publicar: "+e.message,"err"); }
  b.disabled=false; b.textContent="🚀 Publicar";
});

/* Subir imagen al repo */
async function uploadImage(fieldPath){
  if (!ghConfig().token){ toast("Configura GitHub (⚙️) para subir imágenes","err"); return; }
  const input=document.createElement("input");
  input.type="file"; input.accept="image/jpeg,image/png,image/webp";
  input.onchange=async()=>{
    const file=input.files[0]; if(!file) return;
    if (file.size > 3*1024*1024){ toast("Imagen demasiado grande (máx 3 MB). Redúcela antes de subirla.","err"); return; }
    toast("Subiendo "+file.name+"…");
    try{
      const buf=new Uint8Array(await file.arrayBuffer());
      let bin=""; const CH=0x8000;
      for(let i=0;i<buf.length;i+=CH) bin+=String.fromCharCode(...buf.subarray(i,i+CH));
      const name=file.name.toLowerCase().replace(/[^a-z0-9.]+/g,"-").replace(/^-+|-+$/g,"");
      const path="content/img/"+Date.now().toString(36)+"-"+name;
      await ghPut(path, btoa(bin), "content: imagen "+name+" (panel)");
      setP(DRAFT, fieldPath, path);
      saveDraft(); renderSection();
      toast("✅ Imagen subida","ok");
    }catch(e){ toast("Error al subir: "+e.message,"err"); }
  };
  input.click();
}

/* ---------------- Copias y datos ---------------- */
function datosHtml(){
  return `<h1>💾 Copias y datos</h1>
  <p class="sub">Por si prefieres trabajar sin GitHub o quieres una copia de seguridad del contenido.</p>
  <div class="card"><h3>Exportar</h3>
    <p class="sub" style="margin-bottom:.8rem">Descarga el contenido actual (borrador) como <code>content.js</code>. Puede sustituirse a mano en el repositorio, en <code>content/content.js</code>.</p>
    <button class="btn btn--miel" id="btnExport">⬇ Descargar content.js</button>
  </div>
  <div class="card"><h3>Importar</h3>
    <p class="sub" style="margin-bottom:.8rem">Pega aquí el contenido de un <code>content.js</code> (o solo el objeto JSON) para cargarlo como borrador.</p>
    <textarea id="importBox" placeholder="window.SITE_CONTENT = { … };"></textarea>
    <div style="margin-top:.6rem"><button class="btn" id="btnImport">Cargar como borrador</button></div>
  </div>`;
}
function bindDatos(){
  $("btnExport").addEventListener("click",()=>{
    const blob=new Blob([contentFileBody()],{type:"text/javascript"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="content.js"; a.click();
    URL.revokeObjectURL(a.href);
  });
  $("btnImport").addEventListener("click",()=>{
    try{
      let t=$("importBox").value.trim();
      const m=t.match(/window\.SITE_CONTENT\s*=\s*([\s\S]*?);?\s*$/);
      if (m) t=m[1].replace(/;\s*$/,"");
      DRAFT=JSON.parse(t); saveDraft(); toast("Contenido cargado como borrador","ok");
    }catch(e){ toast("No se pudo leer: "+e.message,"err"); }
  });
}

/* ---------------- Toast ---------------- */
let toastTimer;
function toast(msg,cls){
  const t=$("toast"); t.textContent=msg; t.className="toast show "+(cls||"");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.className="toast",3600);
}

renderSection();
paintStatus();
if (localStorage.getItem(LS_DRAFT)) toast("Hay un borrador guardado de una sesión anterior");
</script>
